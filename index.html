<!DOCTYPE html>
<html lang="en">
<head>
  <title><h1>Rahul Ki First Website</h1></title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
    }

    /* Header */
    .header {
      padding: 60px 20px;
      text-align: center;
      background: #1abc9c;
      color: white;
    }

    .header h1 {
      font-size: 40px;
    }

    /* Navigation */
    .navbar {
      overflow: hidden;
      background-color: #333;
    }

    .navbar a {
      float: left;
      display: block;
      color: white;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
      cursor: pointer;
    }

    .navbar a.right {
      float: right;
    }

    .navbar a:hover {
      background-color: #ddd;
      color: black;
    }

    /* Main */
    .row {
      display: flex;
      flex-wrap: wrap;
    }

    .side {
      flex: 30%;
      background-color: #f1f1f1;
      padding: 20px;
    }

    .main {
      flex: 70%;
      background-color: white;
      padding: 20px;
    }

    /* Login Box */
    .login-box {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px;
      background: #f1f1f1;
      border-radius: 10px;
    }

    .login-box h2 {
      text-align: center;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #1abc9c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: #159a80;
    }

    #message {
      text-align: center;
      color: red;
    }

    /* Footer */
    .footer {
      padding: 20px;
      text-align: center;
      background: #ddd;
    }

    /* Responsive */
    @media screen and (max-width: 700px) {
      .row {
        flex-direction: column;
      }
    }

    @media screen and (max-width: 400px) {
      .navbar a {
        float: none;
        width: 100%;
      }

      .navbar a.right {
        float: none;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <h1>My Website</h1>
    <p>My first login system</p>
  </div>

  <!-- Navigation -->
  <div class="navbar">
    <a onclick="showHome()">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
    <a class="right" onclick="showLogin()">Login</a>
    <a class="right" onclick="logout()" id="logoutButton" style="display:none;">
      Logout
    </a>
  </div>

  <!-- Login Page -->
  <div id="loginPage" class="login-box">

    <h2>Login</h2>

    <input
      type="text"
      id="username"
      placeholder="Enter username"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter password"
    >

    <button onclick="login()">Login</button>

    <p id="message"></p>

  </div>

  <!-- Home Page -->
  <div id="homePage" style="display:none;">

    <div class="row">

      <div class="side">
        <h2>About Me</h2>
        <p>Welcome to my website.</p>
      </div>

      <div class="main">
        <h2>Home</h2>

        <p id="welcomeMessage">
          Welcome!
        </p>

        <p>
          You have successfully logged in.
        </p>
      </div>

    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <h2>My Website</h2>
  </div>


  <script>

    // Login function
    function login() {

      // Input se value lena
      let username = document.getElementById("username").value;
      let password = document.getElementById("password").value;

      // Demo username aur password
      let correctUsername = "admin";
      let correctPassword = "1234";

      // Username aur password check karna
      if (
        username === correctUsername &&
        password === correctPassword
      ) {

        // Login page hide
        document.getElementById("loginPage").style.display = "none";

        // Home page show
        document.getElementById("homePage").style.display = "block";

        // Welcome message
        document.getElementById("welcomeMessage").innerText =
          "Welcome, " + username + "!";

        // Login button hide
        document.querySelector(".navbar a.right").style.display = "none";

        // Logout button show
        document.getElementById("logoutButton").style.display = "block";

      } else {

        // Galat login
        document.getElementById("message").innerText =
          "Wrong username or password!";

      }
    }


    // Login page show karna
    function showLogin() {

      document.getElementById("loginPage").style.display = "block";
      document.getElementById("homePage").style.display = "none";

    }


    // Home page show karna
    function showHome() {

      document.getElementById("loginPage").style.display = "none";
      document.getElementById("homePage").style.display = "block";

    }


    // Logout function
    function logout() {

      // Home hide
      document.getElementById("homePage").style.display = "none";

      // Login show
      document.getElementById("loginPage").style.display = "block";

      // Login button show
      document.querySelector(".navbar a.right").style.display = "block";

      // Logout button hide
      document.getElementById("logoutButton").style.display = "none";

      // Input clear
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";

    }

  </script>
</body>
</html>
